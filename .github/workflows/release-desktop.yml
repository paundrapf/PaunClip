name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional tag to attach a draft release to, for example v0.1.0"
        required: false
        type: string

permissions:
  contents: write

env:
  NEXT_TELEMETRY_DISABLED: "1"
  YTDLP_VERSION: latest
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows desktop package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package desktop app
        run: npm run desktop:pack

      - name: Smoke packaged desktop app
        run: npm run desktop:smoke

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paunclip-windows-desktop
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
          draft: true
          prerelease: false
          files: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/latest*.yml
          fail_on_unmatched_files: false
